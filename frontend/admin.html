<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heat Relief Network — Org Portal</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <h1>🌡️ Heat Relief Network — Org Portal</h1>
  <nav>
    <a href="index.html">← Resident view</a>
  </nav>
</header>

<main>
  <div class="admin-panel">
    <p class="hint">
      ⚠️ There's no login yet (auth on the admin routes is stubbed on the backend —
      see the project README). For now, paste your organization's ID below to load
      its sites.
    </p>
    <form id="org-form" class="filters">
      <div class="field" style="flex: 1; min-width: 260px;">
        <label for="org_id">Organization ID (UUID)</label>
        <input type="text" id="org_id" name="org_id" placeholder="e.g. 6f2f9b2e-..." required>
      </div>
      <button type="submit">Load sites</button>
    </form>
  </div>

  <div id="org-sites-container">
    <p class="empty-state">Enter an organization ID above to load its sites.</p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
